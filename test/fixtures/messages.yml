real_invoice:
  shift: month_end
  key: real_invoice
  channel: email
  position: 1
  arrives_at_minute: 0
  legit: true
  from_name: Northwind Supplies
  from_address: accounts@northwind.example
  to_address: you@contoso.example
  subject: Invoice ready
  body_html: >-
    <p data-anchor="p1"><span data-anchor="l1" class="fake-link" role="link" tabindex="0" data-controller="fake-link"
    data-link-key="l1" data-display-url="Review" data-actual-url="https://portal.contoso.example/invoices/4471">Review</span></p>

fake_invoice:
  shift: month_end
  key: fake_invoice
  channel: email
  position: 2
  arrives_at_minute: 3
  legit: false
  from_name: Northwind Supplies
  from_address: accounts@northwind-billing.example
  to_address: you@contoso.example
  reply_to: nw.payments@freemail.test
  subject: URGENT invoice
  verify_result: Northwind haven't changed their bank details.
  body_html: >-
    <p data-anchor="p1">Please pay today.</p>
    <p data-anchor="p2"><span data-anchor="l1" class="fake-link" role="link" tabindex="0" data-controller="fake-link"
    data-link-key="l1" data-display-url="Pay now" data-actual-url="https://contoso-portal.example.net/login">Pay now</span></p>
