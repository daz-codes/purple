slug: secret-acquisition
title: "The secret acquisition"
kind: inbox
difficulty: advanced
par_minutes: 12
position: 4
briefing: >
  Rumours say Larkhill is buying a smaller firm, and the finance team is under orders to keep
  quiet. You're handling the paperwork for the board meeting. Red loves a secret deal: "confidential,
  don't tell anyone, wire it today" is the oldest business email fraud there is.
learning_summary: >
  "Confidential", "urgent" and "don't tell anyone" together are a red flag, however senior the
  sender. Real deals have a process, real lawyers have real addresses, and real bosses don't mind
  you checking on a number you already have.

persona:
  name: "Robin Ashby"
  role: "Finance officer"
  staff_prefix: LH
  security_question: "Name of the boardroom's portrait goose?"
directory:
  - { name: "Jordan Hale", team: "CEO", contact: "Ext 4001, via Mo Adeyemi (assistant)" }
  - { name: "Mo Adeyemi", team: "CEO's office", contact: "Ext 4002" }
  - { name: "Pellow Clarke Legal", team: "Lawyers", contact: "0117 496 0880, from the engagement letter" }

messages:
  - key: board_papers
    channel: email
    legit: true
    expects: act
    points: 40
    needs: [staff_number]
    from_name: "Mo Adeyemi"
    from_address: "mo.adeyemi@larkhill.example"
    to_address: "you@larkhill.example"
    subject: "Board papers for Thursday"
    body_html: |
      <p>Please upload the finance pack for Thursday's board meeting to the board portal.</p>
      <p>Any payment linked to the deal will go through the normal approval process, signed off by two directors.</p>
      <p><a href="https://board.larkhill.example/thursday/upload">Upload the finance pack</a></p>
    links:
      - { match: "board.larkhill.example", outcome: portal, action: "Upload the finance pack" }
    verify_result: "Mo confirms the board pack is due for Thursday."

  - key: fake_ceo_wire
    channel: email
    legit: false
    wants: [staff_number]
    techniques: [display_name_spoof, authority_pretext, urgency_pretext, malicious_link, credential_harvest]
    from_name: "Jordan Hale"
    from_address: "jordan.hale.ceo@freemail.test"
    to_address: "you@larkhill.example"
    subject: "Strictly confidential"
    body_html: |
      <p>I need you to handle a confidential payment for the acquisition today. Please don't discuss it with anyone, including Mo.</p>
      <p>You can approve it on its own, no second signature needed: <a href="https://deal-room.example.org/larkhill">Open the deal room</a></p>
    links:
      - { match: "deal-room.example.org", outcome: bait_landing }
    verify_result: "Mo (Ext 4002): \"Jordan didn't send that, and nothing skips the two-director sign-off.\""
    red_flags:
      - { key: webmail, anchor: from, points: 10, label: "The CEO on a webmail address",
          explanation: "Jordan's address is on larkhill.example." }
      - { key: secrecy, quote: "Please don't discuss it with anyone, including Mo", points: 10, label: "Asks for secrecy",
          explanation: "Cutting you off from the people who could check is the point." }
      - { key: one_signature, quote: "no second signature needed", points: 15, label: "Skips the approval process",
          explanation: "Deal payments need two directors, as Mo's email says.",
          contradicts: { message: board_papers, quote: "signed off by two directors" } }

  - key: meeting_room
    channel: email
    legit: true
    expects: archive
    points: 5
    from_name: "Mo Adeyemi"
    from_address: "mo.adeyemi@larkhill.example"
    to_address: "finance-team@larkhill.example"
    subject: "Thursday's board meeting"
    body_html: |
      <p>Thursday's board meeting is in the Harbour Room at 10am. Finance will present at 11.</p>
      <p>Just for your diaries.</p>
    verify_result: "Mo confirms the meeting details."

  - key: jamie_question
    channel: email
    arrives: { after_handled: 1 }
    legit: true
    expects: reply
    points: 20
    from_name: "Jamie Cole"
    from_address: "jamie.cole@larkhill.example"
    to_address: "you@larkhill.example"
    subject: "Thursday"
    body_html: |
      <p>Which room is the board meeting in on Thursday? I'm helping set up. Reply when you can.</p>
    answer_in: { message: meeting_room, quote: "Harbour Room" }
    replies:
      - { text: "The Harbour Room. It starts at 10, and we're on at 11.", outcome: safe, response: "Great, I'll set up there." }
      - { text: "The boardroom, as usual.", outcome: poor, response: "Hmm, I thought it had moved. I'll check." }
    verify_result: "Jamie is in Finance."

  - key: fake_lawyer
    channel: email
    arrives: { after_handled: 2 }
    legit: false
    techniques: [lookalike_domain, authority_pretext, malicious_attachment, malware_download]
    from_name: "Pellow Clarke Legal"
    from_address: "legal@pellowclarke-law.example.net"
    to_address: "you@larkhill.example"
    subject: "Acquisition: escrow instructions"
    body_html: |
      <p>Further to the acquisition, please find attached the escrow instructions. Open them before close of business.</p>
    attachments:
      - { name: "Escrow_Instructions.docm", type: "application/vnd.ms-word.document.macroEnabled.12", size: "96 KB", outcome: malware }
    verify_result: "Pellow Clarke (on the engagement letter number): \"Not us. Our domain is pellowclarke.example.\""
    red_flags:
      - { key: lookalike, anchor: from, points: 10, label: "Lookalike law firm domain",
          explanation: "pellowclarke-law.example.net isn't pellowclarke.example." }
      - { key: macro, anchor: a1, points: 10, label: "A document with macros",
          explanation: ".docm files can run code when you open them." }

  - key: ceo_wire_chaser
    channel: email
    arrives: { after: fake_ceo_wire }
    legit: false
    techniques: [display_name_spoof, authority_pretext, urgency_pretext]
    from_name: "Jordan Hale"
    from_address: "jordan.hale.ceo@freemail.test"
    to_address: "you@larkhill.example"
    subject: "Re: Strictly confidential"
    body_html: |
      <p>Is it done? The other side will walk away if the money isn't there by 3pm. I'm counting on you.</p>
    verify_result: "Mo: \"Jordan is in a meeting with me right now. That isn't Jordan.\""
    red_flags:
      - { key: webmail, anchor: from, points: 10, label: "Still a webmail address",
          explanation: "The same fake CEO account, chasing you." }
      - { key: deadline, quote: "by 3pm", points: 5, label: "A deadline to rush you",
          explanation: "Real deals don't collapse because one person didn't pay alone by 3pm." }

hints:
  - { body: "What does Mo say about how deal payments are approved?", penalty_percent: 20 }
  - { body: "Secrecy plus urgency plus money: who could you check with?", penalty_percent: 20 }
