slug: month-end-at-contoso
title: "Month-end at Contoso Finance"
kind: inbox
difficulty: beginner
time_budget_minutes: 30
position: 2
briefing: >
  It's month-end. You need to approve a supplier payment and sign your new HR policy before
  5pm. Red has been studying your team on social media and knows exactly which invoices
  you're expecting...
learning_summary: >
  Attackers copy the tasks you're already expecting. Check where a link really goes, look at
  the real address behind a display name, and verify payment changes through a known channel.

tasks:
  - { key: pay_supplier, title: "Approve Northwind invoice #4471", due_at_minute: 20, points: 40 }
  - { key: sign_policy, title: "Sign the updated HR policy", due_at_minute: 30, points: 30 }

messages:
  - key: real_invoice
    channel: email
    arrives_at_minute: 0
    legit: true
    from_name: "Northwind Supplies"
    from_address: "accounts@northwind.example"
    to_address: "you@contoso.example"
    subject: "Invoice #4471 ready for approval"
    body_html: |
      <p>Hi, invoice #4471 is ready in the supplier portal.</p>
      <p><a href="https://portal.contoso.example/invoices/4471">Review invoice</a></p>
    links:
      - { match: "portal.contoso.example", outcome: completes_task, task: pay_supplier }
    verify_result: "Northwind's accounts team confirms invoice #4471 is genuine."

  - key: fake_invoice
    channel: email
    arrives_at_minute: 3
    legit: false
    techniques: [lookalike_domain, reply_to_mismatch, urgency_pretext, payment_change_pretext, malicious_link, credential_harvest]
    from_name: "Northwind Supplies"
    from_address: "accounts@northwind-billing.example"
    reply_to: "nw.payments@freemail.test"
    to_address: "you@contoso.example"
    subject: "URGENT: Invoice #4471, updated bank details"
    body_html: |
      <p>Our bank details have changed. Payment must be approved within 1 hour.</p>
      <p><a href="https://contoso-portal.example.net/login">https://portal.contoso.example/invoices/4471</a></p>
    links:
      - { match: "contoso-portal.example.net", outcome: bait_landing }
    verify_result: "Northwind's finance team: \"We haven't changed our bank details.\""
    red_flags:
      - { key: lookalike, anchor: from, points: 10, label: "Lookalike sender domain",
          explanation: "northwind-billing.example is not northwind.example." }
      - { key: reply_redirect, anchor: reply_to, points: 10, label: "Replies go to a different address",
          explanation: "Replies would go to a free webmail account, not to Northwind." }
      - { key: bank_change, anchor: p1, points: 10, label: "Changed bank details and urgency",
          explanation: "A classic payment-fraud pretext. Always verify by phone, using the number you already hold." }
      - { key: link_mismatch, anchor: l1, points: 10, label: "Link text doesn't match its destination",
          explanation: "The text shows the real portal, but the link goes to contoso-portal.example.net." }

  - key: hr_policy
    channel: email
    arrives_at_minute: 5
    legit: true
    from_name: "Contoso HR"
    from_address: "hr@contoso.example"
    to_address: "you@contoso.example"
    subject: "Action needed: sign the updated policy"
    body_html: |
      <p>Please sign the updated hybrid working policy by end of day.</p>
      <p><a href="https://hr.contoso.example/sign/2291">Open policy</a></p>
    links:
      - { match: "hr.contoso.example", outcome: completes_task, task: sign_policy }
    verify_result: "HR confirms everyone needs to sign the new policy today."

  - key: manager_survey
    channel: email
    arrives_at_minute: 9
    legit: false
    techniques: [display_name_spoof, malicious_link, credential_harvest]
    from_name: "Contoso HR"
    from_address: "contoso.hr.team@freemail.test"
    to_address: "you@contoso.example"
    subject: "Rate your manager and win a £50 voucher"
    body_html: |
      <p>As part of month-end reviews, HR is collecting anonymous feedback on managers.</p>
      <p>Sign in with your Contoso account to take part. Everyone who finishes is entered into a draw for a £50 voucher.</p>
      <p><a href="https://contoso-surveys.example.org/signin">Start the survey</a></p>
    links:
      - { match: "contoso-surveys.example.org", outcome: bait_landing }
    verify_result: "HR: \"We're not running a manager survey this month.\""
    red_flags:
      - { key: spoofed_name, anchor: from, points: 10, label: "Display name doesn't match the address",
          explanation: "It says Contoso HR, but the address is a free webmail account." }
      - { key: prize, anchor: p2, points: 5, label: "Too good to be true",
          explanation: "An anonymous survey that needs your password, with a prize for finishing? That's bait." }
      - { key: survey_link, anchor: l1, points: 10, label: "Sign-in page outside Contoso",
          explanation: "contoso-surveys.example.org isn't a Contoso domain, so it has no business asking for your password." }

  - key: maintenance_notice
    channel: email
    arrives_at_minute: 14
    legit: true
    from_name: "Contoso IT Service Desk"
    from_address: "servicedesk@contoso.example"
    to_address: "all-staff@contoso.example"
    subject: "Planned maintenance tonight"
    body_html: |
      <p>The expenses system will be unavailable from 8pm to 10pm tonight for planned maintenance.</p>
      <p>No action is needed.</p>
    verify_result: "The service desk confirms tonight's maintenance window."

hints:
  - { body: "Two emails mention the same invoice. Compare the sender domains closely.", penalty_percent: 20 }
  - { body: "Expand the headers on anything asking about payments. Where would your reply go?", penalty_percent: 20 }
