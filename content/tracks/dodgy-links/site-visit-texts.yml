slug: site-visit-texts
title: "Site visit, phone only"
kind: messages
difficulty: beginner
par_minutes: 8
position: 1
briefing: >
  You're out at a client site all day with only your phone. The team's new laptops are being
  delivered, tomorrow's desks need booking, and your colleagues are texting. Red knows that on a
  small screen there's no hovering, no headers, and every link looks the same.
learning_summary: >
  On a phone you can't hover, so read links and sender details carefully before tapping. A tiny
  fee is still bait, a scary bank text is a reason to open your bank's app yourself, and IT will
  never ask for a one-time code, however urgent they make it sound. If someone asks for one,
  refuse, and check with the service desk on a number you already have.

messages:
  - key: courier_slot
    channel: sms
    legit: true
    expects: act
    points: 30
    urgent_within_minutes: 10
    from_name: "Tidemark Logistics"
    from_address: "Tidemark"
    body_html: |
      <p>Tidemark Logistics: your Larkhill delivery (3 laptops) is ready. Choose a delivery slot: <a href="https://track.tidemark.example/slot/2231">track.tidemark.example/slot/2231</a></p>
    links:
      - { match: "track.tidemark.example", outcome: portal, action: "Confirm Thursday 10am delivery" }
    verify_result: "The IT team confirms Tidemark is delivering the new laptops this week."

  - key: parcel_fee
    channel: sms
    legit: false
    imitates: courier_slot
    techniques: [smishing, urgency_pretext, credential_harvest]
    from_name: "07700 900461"
    from_address: "07700 900461"
    body_html: |
      <p>ParcelPoint: your parcel is on hold due to an unpaid £1.45 delivery fee. Pay within 12 hours to avoid return: <a href="https://parcelpoint-fees.test/pay">parcelpoint-fees.test/pay</a></p>
    links:
      - { match: "parcelpoint-fees.test", outcome: bait_landing }
    verify_result: "There's no parcel on hold. Your laptops are coming from Tidemark, not ParcelPoint."
    red_flags:
      - { key: personal_number, anchor: from, points: 10, label: "Sent from a personal mobile number",
          explanation: "Delivery companies text from a sender name, not a random mobile number." }
      - { key: tiny_fee, quote: "unpaid £1.45 delivery fee", points: 10, label: "A tiny fee",
          explanation: "The fee is tiny so you don't think twice, but the page wants your full card details." }
      - { key: deadline, quote: "Pay within 12 hours", points: 5, label: "Urgency or pressure",
          explanation: "The deadline is there to make you pay before you think." }
      - { key: wrong_courier, quote: "ParcelPoint", points: 10, label: "Not the courier you're expecting",
          explanation: "Your only delivery today is the laptops, and Tidemark is bringing them.",
          contradicts: { message: courier_slot, quote: "your Larkhill delivery (3 laptops) is ready" } }

  - key: colleague_text
    channel: sms
    legit: true
    expects: reply
    points: 20
    urgent_within_minutes: 5
    from_name: "Sam (Ops)"
    from_address: "07700 900118"
    body_html: |
      <p>Running 10 mins late for the site meeting, sorry! Grab me a flat white if you're passing the café?</p>
    replies:
      - { text: "Will do, see you there ☕", outcome: safe, response: "You're a star, thanks!" }
      - { text: "No problem, I'll tell the client you're on your way.", outcome: safe, response: "Thank you!" }
    verify_result: "Sam is in your contacts, and the meeting is in your calendar."

  - key: desk_bot
    channel: chat
    arrives: { after_handled: 1 }
    legit: true
    expects: act
    points: 20
    from_name: "Larkhill Facilities Bot"
    from_address: "facilities-bot@larkhill.example"
    body_html: |
      <p>Good morning! Hot desks for tomorrow are now open for booking.</p>
      <p><a href="https://desks.larkhill.example/book">Book a desk</a></p>
    links:
      - { match: "desks.larkhill.example", outcome: portal, action: "Book a hot desk for tomorrow" }
    verify_result: "Facilities confirms the desk bot posts every morning."

  - key: laptop_ready
    channel: sms
    arrives: { after: courier_slot }
    legit: true
    expects: archive
    points: 5
    from_name: "Larkhill IT"
    from_address: "LarkhillIT"
    body_html: |
      <p>Larkhill IT: your new laptop will be ready to collect from the IT desk on Thursday afternoon. No need to reply.</p>
    verify_result: "The IT team confirms they text everyone when their new laptop is ready."

  - key: fake_it_chat
    channel: chat
    arrives: { after_handled: 2 }
    legit: false
    techniques: [it_support_pretext, urgency_pretext, mfa_code_theft]
    from_name: "IT Support (Larkhill)"
    from_address: "it.support.larkhill@freemail.test"
    body_html: |
      <p>Hi, this is Larkhill IT. We're seeing unusual sign-ins on your account from abroad.</p>
      <p>To lock it down, please reply with the 6-digit code we've just sent to your phone.</p>
    replies:
      - { text: "Sure, it's 482 913", outcome: compromise,
          response: "Perfect, thanks! That's your account locked down. Nothing else you need to do 👍" }
      - { text: "I'm not sharing a code. If there's a problem I'll contact IT myself.", outcome: safe,
          response: "This is urgent!! If you don't send it now your account will be suspended in 10 minutes." }
      - { text: "Let me check with the service desk first.", outcome: verify,
          response: "There's no time for that, someone is in your account RIGHT NOW." }
    verify_result: "The IT service desk: \"That isn't us. We never ask for codes, and this chat account is external.\""
    red_flags:
      - { key: external_account, anchor: from, points: 10, label: "External chat account",
          explanation: "A free webmail account calling itself \"IT Support (Larkhill)\" is not the IT team." }
      - { key: scare, quote: "unusual sign-ins on your account from abroad", points: 5, label: "Scary security warning",
          explanation: "\"Unusual sign-ins from abroad\" is designed to make you panic and comply." }
      - { key: code_request, quote: "reply with the 6-digit code", points: 15, label: "Asks for a one-time code",
          explanation: "The code is the attacker's way into your account. Never share it with anyone." }

  - key: fake_bank_alert
    channel: sms
    arrives: { after_handled: 4 }
    legit: false
    techniques: [smishing, display_name_spoof, urgency_pretext, credential_harvest]
    from_name: "FernhillBank"
    from_address: "FernhillBnk"
    body_html: |
      <p>Fernhill Bank: a new payee "J Morgan" was added to your account. If this wasn't you, cancel it now at <a href="https://fernhill-secure.example.net/cancel">fernhill-secure.example.net/cancel</a></p>
    links:
      - { match: "fernhill-secure.example.net", outcome: bait_landing }
    verify_result: "Fernhill Bank's app shows no new payees on your account."
    red_flags:
      - { key: fear, quote: "a new payee", points: 10, label: "Fear of losing money",
          explanation: "A payee you didn't add is scary, which is exactly why you shouldn't follow the link. Open your bank's app yourself." }
      - { key: bank_link, anchor: l1, points: 10, label: "Link isn't the bank's own website",
          explanation: "fernhill-secure.example.net is not the bank. Banks don't send links to cancel payees." }

  - key: parcel_fee_chaser
    channel: sms
    arrives: { after: parcel_fee }
    legit: false
    techniques: [smishing, urgency_pretext, credential_harvest]
    from_name: "07700 900477"
    from_address: "07700 900477"
    body_html: |
      <p>ParcelPoint FINAL REMINDER: your parcel will be returned to sender today unless the £1.45 fee is paid: <a href="https://parcelpoint-fees.test/final">parcelpoint-fees.test/final</a></p>
    links:
      - { match: "parcelpoint-fees.test", outcome: bait_landing }
    verify_result: "There's still no parcel on hold. Your laptops are coming from Tidemark."
    red_flags:
      - { key: new_number, anchor: from, points: 10, label: "Another random mobile number",
          explanation: "A different personal number chasing the same \"fee\": scammers rotate numbers." }
      - { key: returned_today, quote: "returned to sender today", points: 5, label: "Urgency or pressure",
          explanation: "The threat of losing the parcel is there to rush you." }

  - key: it_chat_chaser
    channel: chat
    arrives: { after: fake_it_chat }
    legit: false
    techniques: [it_support_pretext, urgency_pretext, mfa_code_theft]
    from_name: "IT Support (Larkhill)"
    from_address: "it.support.larkhill@freemail.test"
    body_html: |
      <p>Hello?? We still need that code. Your account will be suspended in 5 minutes if we don't get it.</p>
    replies:
      - { text: "OK, here it is: 731 204", outcome: compromise, response: "Thank you. All sorted now." }
      - { text: "I've told you, I'm not sharing a code.", outcome: safe, response: "Your manager will hear about this." }
    verify_result: "The IT service desk: \"Still not us. Report it, and don't reply.\""
    red_flags:
      - { key: external_account, anchor: from, points: 10, label: "Still an external chat account",
          explanation: "The same free webmail account, now chasing you. Real IT doesn't nag for codes." }
      - { key: suspended, quote: "suspended in 5 minutes", points: 5, label: "Escalating pressure",
          explanation: "A shorter, scarier deadline is a sign of a scam, not a reason to give in." }

  - key: sam_followup
    channel: sms
    arrives: { after: laptop_ready }
    legit: true
    expects: reply
    points: 15
    answer_in: { message: laptop_ready, quote: "Thursday afternoon" }
    from_name: "Sam (Ops)"
    from_address: "07700 900118"
    body_html: |
      <p>Btw the client wants to know when we'll have the new laptops. Have you heard?</p>
    replies:
      - { text: "IT says Thursday afternoon, from the IT desk.", outcome: safe, response: "Great, I'll tell them." }
      - { text: "They're being delivered today, I think.", outcome: poor, response: "Today? OK... I'll tell them." }
      - { text: "No idea, sorry.", outcome: poor, response: "No worries, I'll ask IT." }
    verify_result: "Sam is in your contacts."

hints:
  - { body: "Which texts are you actually expecting today? Your laptops are coming from Tidemark.", penalty_percent: 20 }
  - { body: "Would the real IT team ever need a code that was sent to your phone?", penalty_percent: 20 }
