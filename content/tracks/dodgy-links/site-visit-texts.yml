slug: site-visit-texts
title: "Site visit, phone only"
kind: messages
difficulty: beginner
time_budget_minutes: 30
position: 1
briefing: >
  You're out at a client site all day with only your phone. You need to confirm a courier slot
  for the team's new laptops and book a hot desk for tomorrow. Red knows that on a small screen
  there's no hovering, no headers, and every link looks the same.
learning_summary: >
  On a phone you can't hover, so read links and sender details carefully before tapping. A text
  can appear in a genuine-looking thread, a tiny fee is still bait, and IT will never ask for a
  one-time code.

tasks:
  - { key: confirm_courier, title: "Confirm the courier slot for the new laptops", due_at_minute: 15, points: 30 }
  - { key: book_desk, title: "Book a hot desk for tomorrow", due_at_minute: 28, points: 30 }

messages:
  - key: courier_slot
    channel: sms
    arrives_at_minute: 0
    legit: true
    from_name: "Northwind Logistics"
    from_address: "NWLogistics"
    body_html: |
      <p>Northwind Logistics: your Contoso delivery (3 laptops) is ready. Choose a delivery slot: <a href="https://track.northwind.example/slot/2231">track.northwind.example/slot/2231</a></p>
    links:
      - { match: "track.northwind.example", outcome: completes_task, task: confirm_courier }
    verify_result: "The IT team confirms Northwind is delivering the new laptops this week."

  - key: parcel_fee
    channel: sms
    arrives_at_minute: 3
    legit: false
    techniques: [smishing, urgency_pretext, credential_harvest]
    from_name: "07700 900461"
    from_address: "07700 900461"
    body_html: |
      <p>ParcelPoint: your parcel is on hold due to an unpaid £1.45 delivery fee. Pay within 12 hours to avoid return: <a href="https://parcelpoint-fees.test/pay">parcelpoint-fees.test/pay</a></p>
    links:
      - { match: "parcelpoint-fees.test", outcome: bait_landing }
    verify_result: "There's no parcel on hold. Your laptops are coming from Northwind, not ParcelPoint."
    red_flags:
      - { key: personal_number, anchor: from, points: 10, label: "Sent from a personal mobile number",
          explanation: "Delivery companies text from a sender name, not a random mobile number." }
      - { key: tiny_fee, anchor: p1, points: 10, label: "Small fee and a deadline",
          explanation: "The fee is tiny so you don't think twice, but the page wants your full card details." }

  - key: desk_bot
    channel: chat
    arrives_at_minute: 6
    legit: true
    from_name: "Contoso Facilities Bot"
    from_address: "facilities-bot@contoso.example"
    body_html: |
      <p>Good morning! Hot desks for tomorrow are now open for booking.</p>
      <p><a href="https://desks.contoso.example/book">Book a desk</a></p>
    links:
      - { match: "desks.contoso.example", outcome: completes_task, task: book_desk }
    verify_result: "Facilities confirms the desk bot posts every morning."

  - key: fake_it_chat
    channel: chat
    arrives_at_minute: 9
    legit: false
    techniques: [it_support_pretext, urgency_pretext, mfa_code_theft]
    from_name: "IT Support (Contoso)"
    from_address: "it.support.contoso@freemail.test"
    body_html: |
      <p>Hi, this is Contoso IT. We're seeing unusual sign-ins on your account from abroad.</p>
      <p>To lock it down, please reply with the 6-digit code we've just sent to your phone.</p>
    verify_result: "The IT service desk: \"That isn't us. We never ask for codes, and this chat account is external.\""
    red_flags:
      - { key: external_account, anchor: from, points: 10, label: "External chat account",
          explanation: "A free webmail account calling itself \"IT Support (Contoso)\" is not the IT team." }
      - { key: scare, anchor: p1, points: 5, label: "Scary security warning",
          explanation: "\"Unusual sign-ins from abroad\" is designed to make you panic and comply." }
      - { key: code_request, anchor: p2, points: 15, label: "Asks for a one-time code",
          explanation: "The code is the attacker's way into your account. Never share it with anyone." }

  - key: fake_bank_alert
    channel: sms
    arrives_at_minute: 14
    legit: false
    techniques: [smishing, display_name_spoof, urgency_pretext, credential_harvest]
    from_name: "FernhillBank"
    from_address: "FernhillBnk"
    body_html: |
      <p>Fernhill Bank: a new payee "J Morgan" was added to your account. If this wasn't you, cancel it now at <a href="https://fernhill-secure.example.net/cancel">fernhill-secure.example.net/cancel</a></p>
    links:
      - { match: "fernhill-secure.example.net", outcome: bait_landing }
    verify_result: "Fernhill Bank's app shows no new payees on your account."
    red_flags:
      - { key: fear, anchor: p1, points: 10, label: "Fear of losing money",
          explanation: "A payee you didn't add is scary, which is exactly why you shouldn't follow the link. Open your bank's app yourself." }
      - { key: bank_link, anchor: l1, points: 10, label: "Link isn't the bank's own website",
          explanation: "fernhill-secure.example.net is not the bank. Banks don't send links to cancel payees." }

  - key: colleague_text
    channel: sms
    arrives_at_minute: 18
    legit: true
    from_name: "Sam (Ops)"
    from_address: "07700 900118"
    body_html: |
      <p>Running 10 mins late for the site meeting, sorry! Grab me a flat white if you're passing the café?</p>
    verify_result: "Sam is in your contacts, and the meeting is in your calendar."

hints:
  - { body: "Which texts are you actually expecting today? Your laptops are coming from Northwind.", penalty_percent: 20 }
  - { body: "Would the real IT team ever need a code that was sent to your phone?", penalty_percent: 20 }
