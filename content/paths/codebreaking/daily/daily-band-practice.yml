    title: "Rehearsal notice"
    source: "HF radio, 1400Z"
    question: "Where will the band practise? (The key is PUFFIN.)"
    solution: "The band will practise in the drill hall at seven. Bring earplugs."
    encode: [ { vigenere: PUFFIN } ]
    flag: "drill hall"
    explanation: "Vigenère with the key PUFFIN. A key sent in the clear protects nothing."
