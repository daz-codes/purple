# Kamal 2 deploy for Purple: one VPS running the app (Puma behind Thruster, Solid Queue inside
# Puma), kamal-proxy for SSL, and three accessories on the same server: Postgres, a nightly
# pg_dump, and an rclone copy of the dumps to object storage. See "Deployment" in README.md.
#
# It shares the ARM server and the GitHub container registry with the other daz.codes apps
# (matheminute, sumz). Secrets come from .kamal/secrets. These settings come from your shell (or
# a direnv .envrc); a missing one stops the deploy with a clear error:
#
#   KAMAL_REGISTRY_PASSWORD  a GitHub token that can push to ghcr.io/daz-codes (as for the other apps)
#   ERROR_ALERTS_TO          who gets emailed about production errors
#   BACKUP_S3_ENDPOINT       the object storage endpoint (e.g. https://<account>.r2.cloudflarestorage.com)
#   BACKUP_S3_BUCKET         the bucket for database dumps
<%
  server = "157.180.83.205"
  host = "purple.daz.codes"
%>

service: purple
image: daz-codes/purple

servers:
  web:
    - <%= server %>

# kamal-proxy terminates SSL with a Let's Encrypt certificate for the domain (production.rb has
# assume_ssl and force_ssl on) and only routes healthy containers, checked at /up.
proxy:
  ssl: true
  host: <%= host %>
  healthcheck:
    path: /up
    timeout: 5

registry:
  server: ghcr.io
  username: daz-codes
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - PURPLE_DATABASE_PASSWORD
  clear:
    # The public host name: links in emails, and the only Host header the app answers.
    APP_HOST: <%= host %>
    MAILER_FROM: "Purple <noreply@<%= host %>>"
    # Who gets emailed when production reports an error (see ErrorAlert). Comma-separated.
    ERROR_ALERTS_TO: <%= ENV.fetch("ERROR_ALERTS_TO") { raise "Set ERROR_ALERTS_TO to the address(es) for error emails" } %>
    # The Postgres accessory below, reached over Kamal's Docker network.
    DB_HOST: purple-db
    # Run the Solid Queue supervisor inside Puma: one server, so no separate job container.
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
  backup-logs: accessory logs backup -f
  offsite-logs: accessory logs offsite -f

# Rotate the app's logs (they hold IP addresses) so old ones are overwritten, as the privacy page
# says, rather than kept for ever by Docker's default json-file driver.
logging:
  driver: json-file
  options:
    max-size: 10m
    max-file: 5

volumes:
  - "purple_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  # The server is ARM, like the other daz.codes apps.
  arch: arm64

accessories:
  # Postgres 17. Only reachable from the server itself (and the app over Kamal's network).
  db:
    image: postgres:17.7
    host: <%= server %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: purple
        POSTGRES_DB: purple_production
      secret:
        - POSTGRES_PASSWORD:PURPLE_DATABASE_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

  # A dump of the main database at start-up and every night at 03:00 UTC, kept on the server for
  # 7 days. The same image as the database, so pg_dump matches the server version.
  backup:
    image: postgres:17.7
    host: <%= server %>
    cmd: bash /backup/dump.sh
    env:
      clear:
        PGHOST: purple-db
        PGUSER: purple
        PGDATABASE: purple_production
        BACKUP_AT: "03:00"
        BACKUP_LOCAL_DAYS: 7
      secret:
        - PGPASSWORD:PURPLE_DATABASE_PASSWORD
    files:
      - config/backup/dump.sh:/backup/dump.sh:ro
    volumes:
      - /var/lib/purple-backups:/backups

  # Copies new dumps to object storage every hour and prunes ones older than 30 days. Any
  # S3-compatible provider works (Cloudflare R2, Backblaze B2, AWS S3...).
  offsite:
    image: rclone/rclone:1.75.2
    host: <%= server %>
    cmd: /backup/offsite.sh
    options:
      entrypoint: sh
    env:
      clear:
        BACKUP_DESTINATION: <%= ENV.fetch("BACKUP_S3_BUCKET") { raise "Set BACKUP_S3_BUCKET" } %>/purple
        BACKUP_KEEP_DAYS: 30
        RCLONE_CONFIG_OFFSITE_TYPE: s3
        RCLONE_CONFIG_OFFSITE_PROVIDER: Other
        RCLONE_CONFIG_OFFSITE_ENDPOINT: <%= ENV.fetch("BACKUP_S3_ENDPOINT") { raise "Set BACKUP_S3_ENDPOINT" } %>
        RCLONE_CONFIG_OFFSITE_REGION: <%= ENV.fetch("BACKUP_S3_REGION", "auto") %>
        RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: true
      secret:
        - RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID:BACKUP_S3_ACCESS_KEY_ID
        - RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY:BACKUP_S3_SECRET_ACCESS_KEY
    files:
      - config/backup/offsite.sh:/backup/offsite.sh:ro
    volumes:
      - /var/lib/purple-backups:/backups:ro
